services:
  - type: web
    name: meridian-commerce
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: ecommerce-db
    databaseName: ecommerce_case_study
    user: ecommerce_user
    plan: free
